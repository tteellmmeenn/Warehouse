<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>Барааны жагсаалт</title>
    <style>
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #888; padding: 8px; text-align: left; }
        th { background-color: #f0f0f0; }
        a.button { padding: 8px 12px; background-color: #007BFF; color: white; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Агуулахын бараанууд</h1>
    <a class="button" href="/add">+ Бараа нэмэх</a>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>SKU</th>
                <th>Нэр</th>
                <th>Тоо</th>
                <th>Байршил</th>
                <th>Брэнд</th>
                <th>Модел</th>
                <th>Үнэ</th>
                <th>Баталгаа</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>{{ item.id }}</td>
                <td>{{ item.sku }}</td>
                <td>{{ item.name }}</td>
                <td>{{ item.quantity }}</td>
                <td>{{ item.location }}</td>
                <td>{{ item.brand }}</td>
                <td>{{ item.model_no }}</td>
                <td>{{ item.price }}</td>
                <td>{{ item.warranty }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
