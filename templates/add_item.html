<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шинэ Бараа Нэмэх</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Шинэ Бараа Нэмэх</h1>

        <form method="POST">
            <div class="form-group">
                <label for="sku">SKU</label>
                <input type="text" class="form-control" id="sku" name="sku" placeholder="SKU оруулах" required>
            </div>
            <div class="form-group">
                <label for="name">Нэр</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Барааны нэр" required>
            </div>
            <div class="form-group">
                <label for="quantity">Тоо</label>
                <input type="number" class="form-control" id="quantity" name="quantity" placeholder="Тоо" required min="1">
            </div>
            <div class="form-group">
                <label for="location">Байршил</label>
                <input type="text" class="form-control" id="location" name="location" placeholder="Барааны байршил" required>
            </div>
            <div class="form-group">
                <label for="brand">Брэнд</label>
                <input type="text" class="form-control" id="brand" name="brand" placeholder="Брэнд">
            </div>
            <div class="form-group">
                <label for="model_no">Загварын дугаар</label>
                <input type="text" class="form-control" id="model_no" name="model_no" placeholder="Загварын дугаар">
            </div>
            <div class="form-group">
                <label for="price">Үнэ</label>
                <input type="number" class="form-control" id="price" name="price" placeholder="Үнэ" required min="0.01" step="any">
            </div>
            <div class="form-group">
                <label for="warranty">Хамгаалалтын хугацаа</label>
                <input type="text" class="form-control" id="warranty" name="warranty" placeholder="Баталгаат хугацаа">
            </div>
            <button type="submit" class="btn btn-primary">Нэмэх</button>
            <a href="{{ url_for('web_view') }}" class="btn btn-secondary">Буцах</a>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
